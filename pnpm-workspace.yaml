# Pre-approve build scripts for the packages C3 itself installs that need
# them: `workerd` downloads the platform binary and `esbuild` downloads/
# builds native bindings. Without these, pnpm 11+ aborts the install with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true

# Temporary: make @cloudflare/vite-plugin 1.68 use the same miniflare/workerd as
# wrangler. Windows Smart App Control blocks the older workerd binary.
# Remove once @cloudflare/vite-plugin >= 1.69 (which pins this version) is installed.
overrides:
  '@cloudflare/vite-plugin>miniflare': 5.20261110.0-beta
